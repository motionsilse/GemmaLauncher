 else if(state==='account-error') body=`<div class="identity-title">계정 정보를 확인해 주세요</div><p class="small muted">이 PC에 저장된 로그인을 읽을 수 없습니다. 기존 파일은 보존되어 있습니다.</p><button class="btn" data-action="recheck">상태 다시 확인</button><button class="btn subtle" data-action="folder">저장 폴더 열기</button>`;
 else body=`<div class="account-identity"><div class="avatar">${icon('user')}</div><div class="identity-title">계정을 연결해 주세요</div><p class="small muted">브라우저에서 ChatGPT 계정으로 로그인합니다.</p></div><button class="btn primary wide" data-action="login">ChatGPT 로그인 ${icon('arrow')}</button><p class="account-explain">필요한 연결 프로그램이 없으면 먼저 다운로드합니다.</p>`;
 const foot=signed()?`<div class="usage-heading"><h3>계정 사용량</h3>${usage?`<button class="btn subtle" data-action="usage" ${!running()?'disabled':''}>새로고침</button>`:''}</div>${usage?`<div class="usage-window"><div class="row between small"><strong>5시간 한도</strong><span>20% 사용</span></div><div class="meter"><i style="width:20%"></i></div><p class="small muted">오후 3:30에 초기화</p></div><div class="usage-window"><div class="row between small"><strong>7일 한도</strong><span>46% 사용</span></div><div class="meter"><i style="width:46%"></i></div><p class="small muted">11월 14일에 초기화</p></div><p class="small muted" style="margin-top:13px">${running()?'조회':'마지막 조회'}: 오늘 오후 1:30</p>`:`<p class="small muted">${running()?'최근 사용량을 확인할 수 있습니다.':'서버를 켜면 사용량을 조회할 수 있습니다.'}</p><button class="btn subtle" data-action="usage" ${!running()?'disabled':''} style="margin-top:5px">사용량 조회</button>`}`:'<p class="small muted">로그인은 이 PC에 저장됩니다.<br>다음에는 서버만 켜서 사용합니다.</p>';
 return `<div class="account-top"><h2 class="section-head">ChatGPT 계정</h2>${body}</div><div class="account-foot">${foot}</div>`;
}
function serverPanel(){
 let status='로그인 필요',kind='',action='';
 if(state==='saved'){status='꺼짐';action='<button class="btn primary" data-action="start">서버 켜기</button>';}
 if(state==='starting'){status='시작 중';action='<button class="btn" data-action="cancel-start">시작 취소</button>';}
 if(running()){status='실행 중';kind='on';action='<button class="btn" data-action="stop">서버 끄기</button>';}
 if(state==='port-error'){status='시작 실패';kind='error';action='<button class="btn primary" data-action="start">다시 시작</button>';}
 if(state==='account-error'){status='계정 확인 필요';kind='warn';}
 let body='',note='';
 if(running()){
 body=`<h3>다른 앱의 연결 설정에 입력하세요</h3><p class="small muted" style="margin-top:6px">제공자에서 <strong>OpenAI 호환</strong>을 선택한 뒤 아래 값을 입력합니다.</p><div class="connection-values">${field('API 주소','http://127.0.0.1:8319/v1','address')}${field('API 키',keyVisible?'cat-demo-local-key':'••••••••••••••••••••','key')}${field('모델 이름','gpt-6-luna','model')}</div><button class="btn copyall" data-action="copy-all">연결 정보 모두 복사</button>`;
 note='이 PC의 앱에서 사용할 수 있습니다. 서버를 끄면 새 요청을 받을 수 없습니다.';
 } else if(signed()){
 body=(state==='port-error'?'<div class="error-box" role="alert"><h3>8319 포트를 다른 프로그램이 사용 중입니다</h3><p>해당 프로그램의 서버를 끈 뒤 다시 시작하세요. 로그인 정보는 유지됩니다.</p></div>':'')+`<div class="server-off">${icon('server')}<h3>${state==='starting'?'다른 앱의 연결을 준비하고 있습니다':'서버를 켜면 연결할 수 있습니다'}</h3><p class="muted">${state==='starting'?'서버 시작과 사용할 모델을 확인하고 있습니다. 잠시 기다려 주세요.':'로그인은 완료되었습니다. 서버를 켜면 다른 앱에 입력할 API 주소와 키, 모델 이름이 표시됩니다.'}</p>${state==='starting'?'<div class="progress" style="margin-top:24px"><i style="width:60%"></i></div>':''}</div>`;
 note='서버를 켜는 것만으로 ChatGPT에 질문을 보내지는 않습니다.';
 } else {
 body='<p class="intro">다른 앱에 연결하는 순서</p><ol class="steps"><li><span class="number active">1</span><div><h3>ChatGPT 로그인</h3><p>ChatGPT 계정을 연결합니다. 인증은 브라우저에서 진행합니다.</p></div></li><li><span class="number">2</span><div><h3>API 서버 켜기</h3><p>이 PC에서 다른 앱의 요청을 받을 준비를 합니다.</p></div></li><li><span class="number">3</span><div><h3>다른 앱에 연결 정보 입력</h3><p>표시되는 API 주소·키·모델 이름을 사용할 앱에 복사합니다.</p></div></li></ol><div class="notice">'+icon('info')+'<span>로컬 모델을 다운로드하는 기능과 다릅니다.<br>AI 응답은 인터넷을 통해 ChatGPT 계정으로 요청합니다.</span></div>';
 }
 return `<header class="connection-head"><div><h2>API 서버</h2><span class="status ${kind}">${status}</span></div>${action}</header><div class="connection-body">${body}</div>${note?`<div class="server-note">${note}</div>`:''}`;
}
function field(label,value,key){return `<div class="field"><div><label>${label}</label><code>${value}</code></div><div class="field-actions">${key==='key'?`<button class="btn subtle" data-action="reveal" aria-label="API 키 ${keyVisible?'숨기기':'표시'}">${keyVisible?'숨기기':'표시'}</button>`:''}<button class="btn" data-action="copy" aria-label="${label} 복사">복사</button></div></div>`;}
function message(text){clearTimeout(toastTimer);const toast=document.querySelector('#toast');toast.textContent=text;toast.hidden=false;toastTimer=setTimeout(()=>toast.hidden=true,2600);}
function openDialog(title,body,actions){returnFocus=document.activeElement;modal.innerHTML=`<div class="dialog-body"><h2 id="modal-title">${title}</h2>${body}</div>${(running()||['starting','browser','download'].includes(state))?'<div class="activity" id="modal-activity">'+activity()+'</div>':''}<div class="dialog-actions">${actions||'<button class="btn" data-action="close-modal">닫기</button>'}</div>`;modal.showModal();}
function closeDialog(){modal.close();returnFocus?.focus();}
function onAction(action,button){
 if(action==='login'){transition('browser');workspace.querySelector('[data-action="reopen"]')?.focus();}
 if(action==='reopen')message('시안: 같은 로그인 페이지를 다시 여는 동작입니다.');
 if(action==='cancel-login'){usage=false;transition('first');workspace.querySelector('[data-action="login"]')?.focus();message('로그인을 취소했습니다.');}
 if(action==='start'){transition('starting');workspace.querySelector('[data-action="cancel-start"]')?.focus();setTimeout(()=>{if(state==='starting'){transition('running');if(page==='chat')workspace.querySelector('[data-action="stop"]')?.focus();}},1100);}
 if(['stop','global-stop','cancel-start'].includes(action)){transition('saved');workspace.querySelector('[data-action="start"]')?.focus();message('서버를 껐습니다. 로그인은 유지됩니다.');}
 if(action==='usage'){usage=true;render();if(matchMedia('(max-width:720px)').matches)openDialog('계정 사용량','<p>5시간 한도 · 20% 사용<br>오후 3:30에 초기화</p><p>7일 한도 · 46% 사용<br>11월 14일에 초기화</p><p class="small">조회: 오늘 오후 1:30 · 시안의 예시 값</p>');else message('시안: 예시 사용량을 표시합니다.');}
 if(action==='reveal'){keyVisible=!keyVisible;render();workspace.querySelector('[data-action="reveal"]').focus();}
 if(action==='copy'||action==='copy-all'){button.textContent='복사됨';message('시안: 복사 완료 표시입니다. 실제 클립보드는 변경하지 않습니다.');setTimeout(()=>{if(button.isConnected)button.textContent=action==='copy'?'복사':'연결 정보 모두 복사';},1500);}
 if(action==='logout')openDialog('이 PC에서 로그아웃할까요?',`<p><strong style="color:var(--ink)">user@example.com</strong></p><p>${running()?'실행 중인 ChatGPT 서버를 끄고, ':''}이 PC에 저장된 로그인을 지웁니다. 다시 사용하려면 브라우저에서 로그인해야 합니다.</p><p class="small">로컬 모델 서버는 영향을 받지 않습니다. ChatGPT 웹사이트에서 로그아웃하거나 계정 권한을 취소하는 동작은 아닙니다.</p>`,'<button class="btn" data-action="close-modal" autofocus>취소</button><button class="btn danger" data-action="confirm-logout">로그아웃</button>');
 if(action==='confirm-logout'){closeDialog();usage=false;transition('first');workspace.querySelector('[data-action="login"]')?.focus();message('이 PC에서 로그아웃했습니다.');}
 if(action==='close-modal')closeDialog();
 if(action==='help')openDialog('ChatGPT를 다른 앱에 연결하기','<ol class="help-list"><li><strong>ChatGPT 로그인</strong><br>브라우저에서 인증하면 이 PC에 로그인이 저장됩니다.</li><li><strong>서버 켜기</strong><br>사용할 모델을 확인한 뒤 연결 정보를 표시합니다.</li><li><strong>다른 앱에 입력</strong><br>OpenAI 호환 제공자를 선택하고 API 주소·키·모델 이름을 입력합니다.</li></ol><p class="small">서버 끄기: 요청을 중단하고 로그인은 유지합니다.<br>로그아웃: 서버를 끄고 이 PC의 로그인을 지웁니다.</p>');
 if(action==='diagnostics')openDialog('연결 진단',`<p class="small">모델 확인은 제공되는 모델 목록을 다시 읽습니다. 실제 요청 테스트는 질문 1회를 보내므로 계정 사용량에 반영될 수 있습니다.</p><button class="btn" data-action="model-check" ${!running()?'disabled':''}>모델 목록 다시 확인</button><button class="btn" data-action="request-test" ${!running()?'disabled':''}>실제 요청으로 테스트</button>${!running()?'<p class="small">먼저 서버를 켜 주세요.</p>':''}`);
 if(action==='model-check')message('시안: 기본 모델 gpt-6-luna 확인 결과가 여기에 표시됩니다.');
 if(action==='request-test')message('시안: 실제 요청은 보내지 않았습니다.');
 if(action==='recheck')message('시안: 저장된 계정 상태를 다시 확인하는 동작입니다.');
 if(action==='folder')message('시안: 계정 저장 폴더를 여는 동작입니다.');
 if(action==='back-chat'){page='chat';render();}
}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button&&!button.disabled)onAction(button.dataset.action,button);});
document.querySelector('#scenario').addEventListener('change',event=>{page='chat';usage=false;transition(event.target.value);workspace.scrollTop=0;});
document.querySelector('#login-complete').addEventListener('click',()=>{transition('saved');workspace.querySelector('[data-action="start"]')?.focus();message('로그인 완료. API 서버는 아직 꺼져 있습니다.');});
document.querySelector('#local-tab').addEventListener('click',()=>{page='local';keyVisible=false;render();workspace.scrollTop=0;});
document.querySelector('#chat-tab').addEventListener('click',()=>{page='chat';render();workspace.scrollTop=0;});
document.querySelector('#settings-button').addEventListener('click',()=>openDialog('설정','<label class="stack">표시 언어<select aria-label="표시 언어"><option>한국어</option><option>English</option></select></label><label class="row"><input type="checkbox" checked> 창을 닫아도 트레이에서 계속 실행</label><p class="small">트레이에서 계속 실행하면 켜 둔 두 서버도 유지됩니다. 완전히 끄려면 트레이에서 ‘완전 종료’를 선택하세요.</p><p class="small">설정은 변경 즉시 저장됩니다.</p>'));
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
const initial=new URLSearchParams(location.search).get('state');if([...document.querySelector('#scenario').options].some(o=>o.value===initial))state=initial;document.querySelector('#scenario').value=state;render();
</script>
</html>
